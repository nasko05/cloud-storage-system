# Production deployment: a Caddy reverse proxy in front of the FastAPI app plus
# a dedicated PostgreSQL container, each with its own named volume so data
# survives `docker compose down` and image rebuilds. Caddy is the only publicly
# exposed service (ports 80/443); the app is reachable only on localhost and
# through the Compose network. An optional ClamAV service can be enabled with
# the `antivirus` profile: `docker compose --profile antivirus up -d`.
#
# Public address is controlled by DRIVE_SITE_ADDRESS (default ":80", plain HTTP
# on the server IP). Set it to a domain (e.g. "drive.example.com") and Caddy
# automatically provisions and renews a Let's Encrypt HTTPS certificate.

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: ${DRIVE_PG_PASSWORD:-drive}
      POSTGRES_DB: drive
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        # Baked into the frontend bundle at build time (see Dockerfile). Empty
        # hides the "My Space" link; set it to pair with the space-io editor.
        VITE_PERSONAL_AREA_URL: ${VITE_PERSONAL_AREA_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DRIVE_DATABASE_URL: postgresql+psycopg2://drive:${DRIVE_PG_PASSWORD:-drive}@db:5432/drive
      DRIVE_SECRET_KEY: ${DRIVE_SECRET_KEY:?Set DRIVE_SECRET_KEY in a .env file}
      DRIVE_STORAGE_DIR: /data/blobs
      DRIVE_BACKUP_DIR: /data/backups
      # --- space-io editor plug-in (all optional; unset = standalone drive). ---
      # Share the session JWT across subdomains so the editor is signed in too;
      # set the domain to the registrable parent with a leading dot.
      DRIVE_SSO_COOKIE_DOMAIN: ${DRIVE_SSO_COOKIE_DOMAIN:-}
      DRIVE_SSO_COOKIE_NAME: ${DRIVE_SSO_COOKIE_NAME:-drive_sso}
      DRIVE_SSO_COOKIE_SECURE: ${DRIVE_SSO_COOKIE_SECURE:-true}
      DRIVE_SSO_COOKIE_SAMESITE: ${DRIVE_SSO_COOKIE_SAMESITE:-lax}
      # Pin the passkey RP to the shared parent domain (== editor's
      # VITE_WEBAUTHN_RP_ID) and allow both app origins.
      DRIVE_WEBAUTHN_RP_ID: ${DRIVE_WEBAUTHN_RP_ID:-}
      DRIVE_WEBAUTHN_ORIGIN: ${DRIVE_WEBAUTHN_ORIGIN:-}
      # Trust Caddy's X-Forwarded-Proto/Host so the app builds https:// signed
      # blob URLs (request.base_url). Without this, uploads/downloads use http://
      # and the browser blocks them as mixed content on an HTTPS page. Safe to
      # trust all: only Caddy can reach this port (bound to localhost + network).
      FORWARDED_ALLOW_IPS: "*"
      DRIVE_CORS_ALLOW_ORIGINS: ${DRIVE_CORS_ALLOW_ORIGINS:-*}
      # Per-user quota in bytes (0 = unlimited).
      DRIVE_USER_QUOTA_BYTES: ${DRIVE_USER_QUOTA_BYTES:-0}
      # Backups (daily by default, keep last 10).
      DRIVE_BACKUP_INTERVAL_HOURS: ${DRIVE_BACKUP_INTERVAL_HOURS:-24}
      DRIVE_BACKUP_RETENTION: ${DRIVE_BACKUP_RETENTION:-10}
      # Antivirus: set to true and start the `antivirus` profile to enable.
      DRIVE_CLAMAV_ENABLED: ${DRIVE_CLAMAV_ENABLED:-false}
      DRIVE_CLAMAV_HOST: clamav
      DRIVE_CLAMAV_PORT: "3310"
    volumes:
      - blob_data:/data/blobs
      - backup_data:/data/backups
    # Published on localhost only: external traffic must go through Caddy. The
    # local bind keeps `curl localhost:8000/healthz` working (used by CI).
    ports:
      - "127.0.0.1:${DRIVE_PORT:-8000}:8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # ":80" = plain HTTP on the server IP. Set to a domain for auto-HTTPS.
      DRIVE_SITE_ADDRESS: ${DRIVE_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    # Use public resolvers for outbound lookups (e.g. Let's Encrypt's ACME API).
    # Without this, a host running systemd-resolved hands the container a
    # 127.0.0.53 stub resolver that doesn't exist inside the container, so cert
    # issuance fails. Service names (app, db) still resolve via Docker's embedded
    # DNS on the Compose network.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Join the shared external `web` network so Caddy can reach co-hosted apps
    # (e.g. space-io) by container name. Declaring networks opts the service out
    # of auto-joining the default network, so `default` is listed explicitly to
    # keep reaching `app`.
    networks:
      - default
      - web
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    profiles: ["antivirus"]
    # ClamAV's freshclam needs working outbound DNS to fetch virus definitions.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  # Shared, cross-project network so this Caddy can reverse-proxy to co-hosted
  # apps (e.g. space-io). Create once on the host/CI: `docker network create web`.
  web:
    external: true

volumes:
  db_data:
  blob_data:
  backup_data:
  clamav_data:
  caddy_data:
  caddy_config:
