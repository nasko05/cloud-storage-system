#############################################################################
# OUTPUTS
#############################################################################
Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: !Sub "${EnvironmentName}-ApiEndpoint"

  S3BucketName:
    Description: S3 bucket name for file storage
    Value: !Ref CloudStorageBucket
    Export:
      Name: !Sub "${EnvironmentName}-S3BucketName"

  S3BucketArn:
    Description: S3 bucket ARN
    Value: !GetAtt CloudStorageBucket.Arn

  MetadataTableV2Name:
    Description: DynamoDB v2 metadata table name
    Value: !Ref MetadataTableV2

  MetadataTableV2Arn:
    Description: DynamoDB v2 metadata table ARN
    Value: !GetAtt MetadataTableV2.Arn

  ArchiveJobQueueUrl:
    Description: SQS queue URL for archive jobs
    Value: !Ref ArchiveJobQueue

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub "${EnvironmentName}-UserPoolId"

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${EnvironmentName}-UserPoolClientId"

  UserPoolDomain:
    Description: Cognito User Pool Domain for hosted UI
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"

  CognitoLoginUrl:
    Description: Cognito Hosted UI Login URL
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${UserPoolClient}&response_type=code&scope=email+openid+profile&redirect_uri=http://localhost:3000/callback"

  DriveFilesFunctionArn:
    Description: v2 files Lambda function ARN
    Value: !GetAtt DriveFilesFunction.Arn

  DriveFoldersFunctionArn:
    Description: v2 folders Lambda function ARN
    Value: !GetAtt DriveFoldersFunction.Arn

  DriveSharesFunctionArn:
    Description: v2 shares Lambda function ARN
    Value: !GetAtt DriveSharesFunction.Arn

  DrivePublicLinksAdminFunctionArn:
    Description: v2 public-links admin Lambda function ARN
    Value: !GetAtt DrivePublicLinksAdminFunction.Arn

  DriveDownloadV2FunctionArn:
    Description: v2 private download Lambda function ARN
    Value: !GetAtt DriveDownloadV2Function.Arn

  DrivePublicDownloadV2FunctionArn:
    Description: v2 public download Lambda function ARN
    Value: !GetAtt DrivePublicDownloadV2Function.Arn

  DriveArchiveApiFunctionArn:
    Description: v2 archive API Lambda function ARN
    Value: !GetAtt DriveArchiveApiFunction.Arn

  DriveArchiveWorkerFunctionArn:
    Description: v2 archive worker Lambda function ARN
    Value: !GetAtt DriveArchiveWorkerFunction.Arn
