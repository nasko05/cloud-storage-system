AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Personal Cloud Storage System - Serverless architecture with API Gateway HTTP API,
  Cognito JWT authentication, Lambda microservices, S3 for object storage, and
  DynamoDB for metadata. Optimized for ~1TB personal/family use in eu-central-1.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: ^[a-z0-9-]+$
    Description: Environment prefix for resource names (lowercase, alphanumeric, hyphens only).
  
  AllowedOrigins:
    Type: String
    Default: "http://localhost:3000"
    Description: CORS allowed origin. Set per environment (e.g., https://app.example.com).
  
  PresignedUrlExpirySeconds:
    Type: Number
    Default: 3600
    MinValue: 300
    MaxValue: 43200
    Description: Presigned URL expiry time in seconds (default 1 hour, max 12 hours).
  
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
    Description: CloudWatch Logs retention period in days.

  ShareExpiryDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: Number of days before share links auto-expire (TTL). Set to 365 for long-term shares.

  IdempotencyTtlSeconds:
    Type: Number
    Default: 86400
    MinValue: 60
    MaxValue: 604800
    Description: Idempotency dedupe window in seconds (default 24h).

  ArchiveJobTtlDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 7
    Description: Archive job metadata retention in days.

Resources:
  #############################################################################
  # S3 BUCKET - Object Storage with Lifecycle Rules
  #############################################################################
  CloudStorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${EnvironmentName}-cloudstorage-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: UseIntelligentTiering
            Status: Enabled
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 1
          - Id: ArchiveOldVersions
            Status: Enabled
            NoncurrentVersionTransitions:
              - StorageClass: GLACIER
                TransitionInDays: 30
          - Id: CleanupIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 180
          - Id: ExpireZipDownloads
            Status: Enabled
            Prefix: zips/
            ExpirationInDays: 1
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - !Ref AllowedOrigins
            ExposedHeaders:
              - ETag
            MaxAge: 3600

  #############################################################################
  # DYNAMODB TABLE - Metadata & ACLs (Single Table Design with TTL)
  #############################################################################
  MetadataTableV2:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${EnvironmentName}-metadata-table-v2"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
        - AttributeName: gsi3pk
          AttributeType: S
        - AttributeName: gsi3sk
          AttributeType: S
        - AttributeName: gsi4pk
          AttributeType: S
        - AttributeName: gsi4sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: gsi3pk
              KeyType: HASH
            - AttributeName: gsi3sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI4
          KeySchema:
            - AttributeName: gsi4pk
              KeyType: HASH
            - AttributeName: gsi4sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ArchiveJobDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-archive-jobs-dlq"
      MessageRetentionPeriod: 1209600

  ArchiveJobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-archive-jobs"
      VisibilityTimeout: 900
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ArchiveJobDLQ.Arn
        maxReceiveCount: 3

  #############################################################################
  # S3 AUTO-CLEANUP - Empties bucket before stack deletion
  #############################################################################
  EmptyCloudStorageBucketRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EmptyCloudStorageBucketPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Sid: S3Cleanup
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:ListBucketMultipartUploads
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:AbortMultipartUpload
                Resource:
                  - !GetAtt CloudStorageBucket.Arn
                  - !Sub "${CloudStorageBucket.Arn}/*"

  EmptyCloudStorageBucketFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt EmptyCloudStorageBucketRole.Arn
      Timeout: 900
      MemorySize: 256
      Code:
        ZipFile: |
          import json
          import logging
          import urllib.request
          from botocore.exceptions import ClientError
          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          s3 = boto3.client("s3")

          def send_response(event, context, status, reason=""):
              response_body = {
                  "Status": status,
                  "Reason": reason or f"See CloudWatch logs: {context.log_stream_name}",
                  "PhysicalResourceId": event.get("PhysicalResourceId", context.log_stream_name),
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": {},
              }

              body = json.dumps(response_body).encode("utf-8")
              request = urllib.request.Request(event["ResponseURL"], data=body, method="PUT")
              request.add_header("content-type", "")
              request.add_header("content-length", str(len(body)))
              urllib.request.urlopen(request)

          def chunked(items, size):
              for i in range(0, len(items), size):
                  yield items[i:i + size]

          def empty_bucket(bucket_name):
              try:
                  s3.head_bucket(Bucket=bucket_name)
              except ClientError as error:
                  code = error.response.get("Error", {}).get("Code", "")
                  if code in ("404", "NoSuchBucket", "NotFound"):
                      logger.info("Bucket %s does not exist; skipping cleanup.", bucket_name)
                      return
                  raise

              while True:
                  response = s3.list_object_versions(Bucket=bucket_name, MaxKeys=1000)
                  objects = [
                      {"Key": version["Key"], "VersionId": version["VersionId"]}
                      for version in response.get("Versions", [])
                  ]
                  objects.extend(
                      {"Key": marker["Key"], "VersionId": marker["VersionId"]}
                      for marker in response.get("DeleteMarkers", [])
                  )

                  if not objects:
                      break

                  for batch in chunked(objects, 1000):
                      s3.delete_objects(
                          Bucket=bucket_name,
                          Delete={"Objects": batch, "Quiet": True},
                      )

              while True:
                  response = s3.list_objects_v2(Bucket=bucket_name, MaxKeys=1000)
                  objects = [{"Key": obj["Key"]} for obj in response.get("Contents", [])]
                  if not objects:
                      break

                  for batch in chunked(objects, 1000):
                      s3.delete_objects(
                          Bucket=bucket_name,
                          Delete={"Objects": batch, "Quiet": True},
                      )

              while True:
                  response = s3.list_multipart_uploads(Bucket=bucket_name, MaxUploads=1000)
                  uploads = response.get("Uploads", [])
                  if not uploads:
                      break

                  for upload in uploads:
                      s3.abort_multipart_upload(
                          Bucket=bucket_name,
                          Key=upload["Key"],
                          UploadId=upload["UploadId"],
                      )

              logger.info("Finished emptying bucket %s.", bucket_name)

          def handler(event, context):
              logger.info("Received event: %s", json.dumps(event))
              try:
                  request_type = event["RequestType"]
                  bucket_name = event["ResourceProperties"]["BucketName"]

                  if request_type == "Delete":
                      empty_bucket(bucket_name)

                  send_response(event, context, "SUCCESS")
              except Exception as error:
                  logger.exception("Custom resource failed.")
                  send_response(event, context, "FAILED", str(error))

  EmptyCloudStorageBucketCustomResource:
    Type: Custom::EmptyS3Bucket
    Properties:
      ServiceToken: !GetAtt EmptyCloudStorageBucketFunction.Arn
      BucketName: !Ref CloudStorageBucket

  #############################################################################
  # COGNITO - User Pool & App Client
  #############################################################################
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${EnvironmentName}-cloudstorage-userpool"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: false
          Mutable: true
      UserPoolTags:
        Environment: !Ref EnvironmentName

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${EnvironmentName}-cloudstorage-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${EnvironmentName}-cloudstorage-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - "http://localhost:3000/callback"
        - "https://localhost:3000/callback"
      LogoutURLs:
        - "http://localhost:3000/logout"
        - "https://localhost:3000/logout"
      SupportedIdentityProviders:
        - COGNITO

  #############################################################################
  # CLOUDWATCH LOG GROUPS - With Retention
  #############################################################################
  DriveFilesFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EnvironmentName}-drive-files-fn"
      RetentionInDays: !Ref LogRetentionDays

  DriveFoldersFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EnvironmentName}-drive-folders-fn"
      RetentionInDays: !Ref LogRetentionDays

  DriveSharesFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EnvironmentName}-drive-shares-fn"
      RetentionInDays: !Ref LogRetentionDays

  DrivePublicLinksAdminFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EnvironmentName}-drive-public-links-admin-fn"
      RetentionInDays: !Ref LogRetentionDays

  DriveDownloadV2FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EnvironmentName}-drive-download-fn"
      RetentionInDays: !Ref LogRetentionDays

  DrivePublicDownloadV2FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EnvironmentName}-drive-public-download-fn"
      RetentionInDays: !Ref LogRetentionDays

  DriveArchiveApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EnvironmentName}-drive-archive-api-fn"
      RetentionInDays: !Ref LogRetentionDays

  DriveArchiveWorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EnvironmentName}-drive-archive-worker-fn"
      RetentionInDays: !Ref LogRetentionDays

  #############################################################################
  # IAM ROLES - Least Privilege per Lambda
  #############################################################################
  DriveFilesLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-drive-files-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DriveFilesLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnvironmentName}-drive-files-fn:*"
              - Sid: S3FilesAccess
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                  - s3:ListBucket
                Resource:
                  - !GetAtt CloudStorageBucket.Arn
                  - !Sub "${CloudStorageBucket.Arn}/*"
              - Sid: DynamoDbV2Access
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt MetadataTableV2.Arn
                  - !Sub "${MetadataTableV2.Arn}/index/*"

  DriveFoldersLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-drive-folders-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DriveFoldersLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnvironmentName}-drive-folders-fn:*"
              - Sid: S3DeleteAccess
                Effect: Allow
                Action:
                  - s3:DeleteObject
                Resource:
                  - !Sub "${CloudStorageBucket.Arn}/*"
              - Sid: DynamoDbV2Access
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt MetadataTableV2.Arn
                  - !Sub "${MetadataTableV2.Arn}/index/*"

  DriveSharesLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-drive-shares-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DriveSharesLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnvironmentName}-drive-shares-fn:*"
              - Sid: DynamoDbV2Access
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MetadataTableV2.Arn
                  - !Sub "${MetadataTableV2.Arn}/index/*"

  DrivePublicLinksAdminLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-drive-public-links-admin-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DrivePublicLinksAdminLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnvironmentName}-drive-public-links-admin-fn:*"
              - Sid: DynamoDbV2Access
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MetadataTableV2.Arn
                  - !Sub "${MetadataTableV2.Arn}/index/*"

  DriveDownloadV2LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-drive-download-v2-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DriveDownloadV2LambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnvironmentName}-drive-download-fn:*"
              - Sid: S3DownloadAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt CloudStorageBucket.Arn
                  - !Sub "${CloudStorageBucket.Arn}/*"
              - Sid: DynamoDbV2ReadAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MetadataTableV2.Arn
                  - !Sub "${MetadataTableV2.Arn}/index/*"

  DrivePublicDownloadV2LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-drive-public-download-v2-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DrivePublicDownloadV2LambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnvironmentName}-drive-public-download-fn:*"
              - Sid: S3DownloadAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt CloudStorageBucket.Arn
                  - !Sub "${CloudStorageBucket.Arn}/*"
              - Sid: DynamoDbV2Access
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt MetadataTableV2.Arn
                  - !Sub "${MetadataTableV2.Arn}/index/*"

  DriveArchiveApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-drive-archive-api-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DriveArchiveApiLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnvironmentName}-drive-archive-api-fn:*"
              - Sid: DynamoDbV2Access
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt MetadataTableV2.Arn
                  - !Sub "${MetadataTableV2.Arn}/index/*"
              - Sid: S3ReadAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "${CloudStorageBucket.Arn}/*"
              - Sid: SqsSendMessage
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ArchiveJobQueue.Arn

  DriveArchiveWorkerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-drive-archive-worker-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DriveArchiveWorkerLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnvironmentName}-drive-archive-worker-fn:*"
              - Sid: S3ArchiveAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "${CloudStorageBucket.Arn}/*"
              - Sid: SqsPollAccess
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ArchiveJobQueue.Arn
              - Sid: DynamoDbV2Access
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt MetadataTableV2.Arn
                  - !Sub "${MetadataTableV2.Arn}/index/*"

  #############################################################################
  # LAMBDA FUNCTIONS
  #############################################################################
  DriveFilesFunction:
    Type: AWS::Lambda::Function
    DependsOn: DriveFilesFunctionLogGroup
    Properties:
      FunctionName: !Sub "${EnvironmentName}-drive-files-fn"
      Runtime: python3.11
      Handler: handler.handler
      Role: !GetAtt DriveFilesLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref CloudStorageBucket
          METADATA_TABLE_NAME: !Ref MetadataTableV2
          PRESIGNED_URL_EXPIRY: !Ref PresignedUrlExpirySeconds
          IDEMPOTENCY_TTL_SECONDS: !Ref IdempotencyTtlSeconds
      Code:
        ZipFile: |
          def handler(event, context):
              return {'statusCode': 200, 'body': 'Placeholder - run deploy.sh to update'}

  DriveFoldersFunction:
    Type: AWS::Lambda::Function
    DependsOn: DriveFoldersFunctionLogGroup
    Properties:
      FunctionName: !Sub "${EnvironmentName}-drive-folders-fn"
      Runtime: python3.11
      Handler: handler.handler
      Role: !GetAtt DriveFoldersLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
