      IntegrationUri: !GetAtt DriveDownloadV2Function.Arn
      PayloadFormatVersion: "2.0"

  DrivePublicDownloadV2Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
