AWSTemplateFormatVersion: "2010-09-09"
Description: Frontend hosting with S3 + CloudFront CDN

Parameters:
  EnvironmentName:
    Type: String
    Default: dev

Resources:
  # S3 bucket for frontend files (private - only CloudFront can access)
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${EnvironmentName}-cloudstorage-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Custom resource role for emptying the frontend bucket during stack delete
  EmptyFrontendBucketRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EmptyFrontendBucketPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Sid: S3Cleanup
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:ListBucketMultipartUploads
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:AbortMultipartUpload
                Resource:
                  - !GetAtt FrontendBucket.Arn
                  - !Sub "${FrontendBucket.Arn}/*"

  # Custom resource Lambda that removes all objects, versions, and multipart uploads
  EmptyFrontendBucketFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt EmptyFrontendBucketRole.Arn
      Timeout: 900
      MemorySize: 256
      Code:
        ZipFile: |
          import json
          import logging
          import urllib.request
          from botocore.exceptions import ClientError
          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          s3 = boto3.client("s3")

          def send_response(event, context, status, reason=""):
              response_body = {
                  "Status": status,
                  "Reason": reason or f"See CloudWatch logs: {context.log_stream_name}",
                  "PhysicalResourceId": event.get("PhysicalResourceId", context.log_stream_name),
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": {},
              }

              body = json.dumps(response_body).encode("utf-8")
              request = urllib.request.Request(event["ResponseURL"], data=body, method="PUT")
              request.add_header("content-type", "")
              request.add_header("content-length", str(len(body)))
              urllib.request.urlopen(request)

          def chunked(items, size):
              for i in range(0, len(items), size):
                  yield items[i:i + size]

          def empty_bucket(bucket_name):
              try:
                  s3.head_bucket(Bucket=bucket_name)
              except ClientError as error:
                  code = error.response.get("Error", {}).get("Code", "")
                  if code in ("404", "NoSuchBucket", "NotFound"):
                      logger.info("Bucket %s does not exist; skipping cleanup.", bucket_name)
                      return
                  raise

              while True:
                  response = s3.list_object_versions(Bucket=bucket_name, MaxKeys=1000)
                  objects = [
                      {"Key": version["Key"], "VersionId": version["VersionId"]}
                      for version in response.get("Versions", [])
                  ]
                  objects.extend(
                      {"Key": marker["Key"], "VersionId": marker["VersionId"]}
                      for marker in response.get("DeleteMarkers", [])
                  )

                  if not objects:
                      break

                  for batch in chunked(objects, 1000):
                      s3.delete_objects(
                          Bucket=bucket_name,
                          Delete={"Objects": batch, "Quiet": True},
                      )

              while True:
                  response = s3.list_objects_v2(Bucket=bucket_name, MaxKeys=1000)
                  objects = [{"Key": obj["Key"]} for obj in response.get("Contents", [])]
                  if not objects:
                      break

                  for batch in chunked(objects, 1000):
                      s3.delete_objects(
                          Bucket=bucket_name,
                          Delete={"Objects": batch, "Quiet": True},
                      )

              while True:
                  response = s3.list_multipart_uploads(Bucket=bucket_name, MaxUploads=1000)
                  uploads = response.get("Uploads", [])
                  if not uploads:
                      break

                  for upload in uploads:
                      s3.abort_multipart_upload(
                          Bucket=bucket_name,
                          Key=upload["Key"],
                          UploadId=upload["UploadId"],
                      )

              logger.info("Finished emptying bucket %s.", bucket_name)

          def handler(event, context):
              logger.info("Received event: %s", json.dumps(event))
              try:
                  request_type = event["RequestType"]
                  bucket_name = event["ResourceProperties"]["BucketName"]

                  if request_type == "Delete":
                      empty_bucket(bucket_name)

                  send_response(event, context, "SUCCESS")
              except Exception as error:
                  logger.exception("Custom resource failed.")
                  send_response(event, context, "FAILED", str(error))

  EmptyFrontendBucketCustomResource:
    Type: Custom::EmptyS3Bucket
    Properties:
      ServiceToken: !GetAtt EmptyFrontendBucketFunction.Arn
      BucketName: !Ref FrontendBucket

  # Origin Access Control - allows CloudFront to access private S3 bucket
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${EnvironmentName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Bucket policy - only allow CloudFront to read
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # CloudFront distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100  # US, Canada, Europe only (cheapest)
        
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
        
        # Handle SPA routing - return index.html for 404s
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  FrontendBucketName:
    Description: S3 bucket for frontend files
    Value: !Ref FrontendBucket

  CloudFrontDomain:
    Description: CloudFront distribution domain (your frontend URL)
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref CloudFrontDistribution
